services:
  - type: web
    name: almanar-agency
    runtime: docker
    region: fra
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: almanar-storage
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/almanar.db
      - key: UPLOADS_PATH
        value: /var/data/uploads
